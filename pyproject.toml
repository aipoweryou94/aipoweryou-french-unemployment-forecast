[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aipoweryou-chomage-forecast"
version = "0.3.1"
description = "Open-data pipeline and temporal Transformer for French unemployment scenarios"
requires-python = ">=3.11,<3.13"
dependencies = [
  "certifi>=2024.8.30",
  "matplotlib>=3.9,<4",
  "numpy>=1.26.4,<2",
  "pandas>=2.2.3,<2.4",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pandas-stubs>=2.2,<3",
  "pre-commit>=3.7,<5",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: calls live public APIs; skipped unless RUN_INTEGRATION=1",
]

[tool.coverage.run]
branch = true
source = ["aipoweryou_forecast"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B017"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
