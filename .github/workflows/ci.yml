name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly live-API verification, outside the deterministic push pipeline.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"

      - name: Enforce lint rules
        run: python -m ruff check .

      - name: Enforce formatting
        run: python -m ruff format --check .

      - name: Check static typing
        run: >-
          python -m mypy src fetch_open_data.py plot_scenarios.py
          train_transformer.py

  unit-tests:
    name: Unit tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic unit tests with coverage
        run: >-
          python -m pytest -m "not integration"
          --cov=aipoweryou_forecast
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Store coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  windows-tests:
    name: Windows PowerShell smoke test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bootstrap isolated Windows environment
        shell: pwsh
        run: .\scripts\bootstrap_windows.ps1

      - name: Run Windows quality and unit-test task
        shell: pwsh
        run: .\scripts\tasks.ps1 check

  integration-tests:
    name: Live Insee and Eurostat APIs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Query official public APIs
        env:
          RUN_INTEGRATION: "1"
        run: python -m pytest -m integration
